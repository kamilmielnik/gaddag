name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          CI: true
      - run: bun run build
        env:
          CI: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test the build under Node
        run: |
          node --input-type=module -e "import { Gaddag } from '@kamilmielnik/gaddag'; if (!Gaddag.fromArray(['smoke']).has('smoke')) { throw new Error('ESM smoke test failed'); }"
          node -e "const { Gaddag } = require('@kamilmielnik/gaddag'); if (!Gaddag.deserialize(Gaddag.fromArray(['smoke']).serialize()).has('smoke')) { throw new Error('CJS smoke test failed'); }"
