name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env:
          CI: true
      - run: bun run test
        env:
          CI: true
      - run: bun run build
        env:
          CI: true
      - name: Check committed docs match the build
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git status --porcelain docs
            echo "docs/ is stale — run 'bun run build' and commit the regenerated docs"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Smoke test the build under Node
        run: |
          node --input-type=module -e "import { Gaddag } from '@kamilmielnik/gaddag'; if (!Gaddag.fromArray(['smoke']).has('smoke')) { throw new Error('ESM smoke test failed'); }"
          node -e "const { Gaddag } = require('@kamilmielnik/gaddag'); if (!Gaddag.deserialize(Gaddag.fromArray(['smoke']).serialize()).has('smoke')) { throw new Error('CJS smoke test failed'); }"
